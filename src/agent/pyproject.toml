[project]
name = "battle-school-lunch-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "agent-framework>=1.0.0b1",
  "agent-framework-ag-ui>=1.0.0b1",
  "agent-framework-devui>=1.0.0b1",
  "agent-framework-foundry>=1.10.3",
  "fastapi>=0.115,<1",
  "httpx<1",
  "mcp>=1.29,<2",
  "pydantic-settings<3",
  "uvicorn[standard]<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
  "unit: deterministic scoring and validation tests",
  "integration: AG-UI workflow tests without external model calls",
]
