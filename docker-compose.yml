services:
  api:
    build:
      context: ./src/api
    environment:
      NEIS_API_KEY: ${NEIS_API_KEY:-}
      CORS_ORIGINS: http://localhost:3000
      API_URL: http://api:8000
      AGENT_URL: http://agent:8090
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - app
    restart: unless-stopped

  web:
    build:
      context: ./src/web
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy
      agent:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped

  mcp:
    build:
      context: ./src/mcp
    environment:
      NEIS_API_KEY: ${NEIS_API_KEY:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - app
    restart: unless-stopped

  agent:
    build:
      context: ./src/agent
    environment:
      MCP_URL: http://mcp:8080/mcp
      FOUNDRY_PROJECT_ENDPOINT: ${FOUNDRY_PROJECT_ENDPOINT:-}
      FOUNDRY_API_KEY: ${FOUNDRY_API_KEY:-}
      FOUNDRY_MODEL: ${FOUNDRY_MODEL:-gpt-4o-mini}
      ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_PATH: /app/data/analyses.db
    ports:
      - "8090:8090"
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - app
    volumes:
      - agent-data:/app/data
    restart: unless-stopped

  devui:
    build:
      context: ./src/agent
    command: ["devui", "/app/app", "--host", "0.0.0.0", "--port", "8091", "--no-open", "--no-auth"]
    ports:
      - "8091:8091"
    depends_on:
      agent:
        condition: service_healthy
    networks:
      - app
    profiles: ["devui"]

networks:
  app:
    internal: false

volumes:
  agent-data:
